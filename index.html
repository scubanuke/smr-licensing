<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licensing the Small Modular Reactor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --paper:#F6F7F7; --panel:#FFFFFF;
    --ink:#1A1F26; --muted:#697079; --faint:#DEE2E4;
    --line:#2E5496;           /* the docket spine */
    --line-deep:#1F3864;
    --open:#A8410E;           /* an unresolved issue */
    --serif:'Spectral',Georgia,'Times New Roman',serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--serif); font-size:18px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- shell ---------- */
  .app{display:grid; grid-template-columns:324px 1fr; min-height:100vh}
  .nav{
    background:var(--panel);
    border-right:2px solid var(--line);      /* the spine */
    padding:34px 26px 60px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .content{padding:56px clamp(24px,6vw,96px); max-width:940px}

  /* ---------- masthead in nav ---------- */
  .brand{margin-bottom:30px}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--line-deep); margin:0 0 10px;
  }
  .brand h1{
    font-size:23px; font-weight:600; line-height:1.15; margin:0;
  }
  .brand p{font-size:13.5px; color:var(--muted); margin:8px 0 0; font-style:italic}

  /* ---------- nav groups ---------- */
  .grouplabel{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted);
    margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--faint);
  }
  .flat a{
    display:block; text-decoration:none; color:var(--ink);
    font-size:15.5px; padding:5px 0;
  }
  details{margin:2px 0}
  summary{
    cursor:pointer; list-style:none; padding:5px 0;
    font-size:15.5px; font-weight:500; color:var(--ink);
    display:flex; align-items:baseline; gap:8px;
  }
  summary::-webkit-details-marker{display:none}
  summary .mk{
    font-family:var(--mono); font-size:11px; color:var(--line-deep);
    transition:transform .15s ease;
  }
  details[open] summary .mk{transform:rotate(90deg)}
  .units{margin:2px 0 10px 20px; padding-left:12px; border-left:1px solid var(--faint)}
  .units a{
    display:block; text-decoration:none; color:var(--muted);
    font-size:14px; padding:4px 0; line-height:1.4;
  }
  .nav a:hover{color:var(--line-deep)}
  .nav a.active{
    color:var(--line-deep); font-weight:500;
    position:relative;
  }
  .nav a.active::before{
    content:""; position:absolute; left:-13px; top:50%; transform:translateY(-50%);
    width:5px; height:5px; background:var(--line);   /* tick on the spine */
  }
  .flat a.active::before{left:-26px}
  .units a.reg{color:var(--muted)}
  .units a.reg .li{font-family:var(--mono); font-size:11.5px; color:var(--open); margin-right:7px}

  /* ---------- mobile bar ---------- */
  .topbar{display:none}

  /* ---------- rendered markdown ---------- */
  .md{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .md h1{font-size:34px; font-weight:600; line-height:1.15; margin:0 0 6px; letter-spacing:-.01em}
  .md h2{font-size:24px; font-weight:600; margin:38px 0 12px; padding-top:10px}
  .md h3{font-size:19px; font-weight:600; font-style:italic; margin:28px 0 8px}
  .md p{margin:0 0 16px}
  .md a{color:var(--line-deep); text-underline-offset:2px}
  .md strong{font-weight:600}
  .md ul,.md ol{margin:0 0 18px; padding-left:22px}
  .md li{margin:5px 0}
  .md blockquote{
    margin:0 0 20px; padding:2px 20px; color:var(--muted);
    border-left:2px solid var(--line); font-style:italic;
  }
  .md hr{border:0; border-top:1px solid var(--faint); margin:34px 0}
  .md code{
    font-family:var(--mono); font-size:.82em; background:#EEF0F1;
    padding:1px 6px; border-radius:2px;
  }
  .md pre{
    background:#151A21; color:#D6DCE2; font-family:var(--mono);
    font-size:13px; line-height:1.5; padding:20px 22px; overflow-x:auto;
    border-left:2px solid var(--line); margin:0 0 22px;
  }
  .md pre code{background:none; padding:0; color:inherit; font-size:inherit}
  .md table{
    border-collapse:collapse; width:100%; margin:0 0 22px; font-size:15.5px;
  }
  .md th,.md td{
    text-align:left; padding:9px 14px; border-bottom:1px solid var(--faint);
    vertical-align:top;
  }
  .md thead th{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--muted);
    border-bottom:2px solid var(--line);
  }
  .md tbody tr:last-child td{border-bottom:1px solid var(--faint)}

  .loaderr{color:var(--muted); font-style:italic}

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:20; background:var(--panel);
      border-bottom:2px solid var(--line); padding:14px 20px;
    }
    .topbar .t{font-weight:600; font-size:16px}
    .topbar button{
      font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
      background:none; border:1px solid var(--faint); color:var(--ink);
      padding:7px 12px; cursor:pointer;
    }
    .nav{
      position:fixed; top:51px; left:0; right:0; bottom:0; height:auto;
      border-right:none; z-index:19; display:none;
    }
    .nav.open{display:block}
    .content{padding:30px 22px 60px}
    .md h1{font-size:28px}
  }
  @media (prefers-reduced-motion:reduce){
    .md,*{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<!-- Eclectic Technologies site switcher — HELD OUT DELIBERATELY.
     This site runs standalone while it is under review. When it is ready to be
     connected, restore the shared .etnav block used by the other repositories and
     add entries for this site and the six-lens portal; the same one-block edit then
     goes into ai-governance-course, dba-ma-smr-portal, dba-en-navigation,
     command-broker and publications, each with its own aria-current="page". -->
<div class="etbar" aria-hidden="true"></div>
<style>.etbar{background:#0A1628;height:4px;}</style>
<div class="topbar">
  <span class="t">Licensing the Small Modular Reactor</span>
  <button id="navToggle" aria-label="Toggle navigation">Menu</button>
</div>
<div class="app">
  <aside class="nav" id="nav">
    <div class="brand">
      <p class="eyebrow">SMR Licensing</p>
      <h1>Licensing the Small Modular Reactor</h1>
      <p>a course and an issue register · work in progress</p>
    </div>
    <div id="navtree"></div>
  </aside>
  <main class="content">
    <div class="md" id="md"><p class="loaderr">Loading…</p></div>
  </main>
</div>

<script>
const NAV = [
  { items:[
    {t:"Start Here", f:"README.md"},
    {t:"Course Map", f:"course-map.md"},
  ]},
  { label:"Course", modules:[
    {t:"Module 0 · Orientation", dir:"core/module-0-orientation", units:[
      ["Overview","README.md"],
      ["What a Licensing Action Is","00-what-a-licensing-action-is.md"],
      ["Pick Your Design Family","01-pick-your-design-family.md"],
      ["Open Issues","open-issues.md"]]},
    {t:"Module 1 · Licensing Pathways", dir:"core/module-1-licensing-pathways", units:[
      ["Overview","README.md"],
      ["Part 50 and Part 52","00-part-50-and-part-52.md"],
      ["Part 53 and Part 57","01-part-53-and-part-57.md"],
      ["Topical Reports","02-topical-reports.md"],
      ["Snapshot: 2026 Rule Status","90-snapshot-2026-rule-status.md"],
      ["Open Issues","open-issues.md"]]},
    {t:"Module 2 · What the Staff Reviews", dir:"core/module-2-what-the-staff-reviews", units:[
      ["Overview","README.md"],
      ["Application Content and the GDC","00-application-content-and-the-gdc.md"],
      ["RAIs, the SE, and ACRS","01-rais-the-se-and-acrs.md"],
      ["The Conformance Matrix","02-the-conformance-matrix.md"],
      ["Open Issues","open-issues.md"]]},
    {t:"Module 3 · Consequence and Source Term", dir:"core/module-3-consequence-and-source-term", units:[
      ["Overview","README.md"],
      ["The Mechanistic Source Term","00-the-mechanistic-source-term.md"],
      ["From Dose to Zone","01-from-dose-to-zone.md"],
      ["Aggregate Inventory","02-aggregate-inventory.md"],
      ["Open Issues","open-issues.md"]]},
    {t:"Module 4 · Security Licensing", dir:"core/module-4-security-licensing", units:[
      ["Overview","README.md"],
      ["The DBT and Physical Protection","00-the-dbt-and-physical-protection.md"],
      ["Cyber Security under 73.54","01-cyber-security-under-73-54.md"],
      ["Safeguards Information","02-safeguards-information.md"],
      ["Open Issues","open-issues.md"]]},
    {t:"Module 5 · The Military-Action Layer", dir:"core/module-5-military-action-layer", units:[
      ["Overview","README.md"],
      ["The State-Actor Layer","00-the-state-actor-layer.md"],
      ["The Conditionality Check","01-the-conditionality-check.md"],
      ["Correlated-Barrier Cutsets","02-correlated-barrier-cutsets.md"],
      ["The Dual Design Basis","03-the-dual-design-basis.md"],
      ["Verification and the PRA Bridge","04-verification-and-the-pra-bridge.md"],
      ["Open Issues","open-issues.md"]]},
  ]},
  { label:"Bridge", modules:[
    {t:"Module 6 · Assembling a Submittal", dir:"bridge/module-6-assembling-a-submittal", units:[
      ["Overview","README.md"],
      ["The Three-Track Package","00-the-three-track-package.md"],
      ["Matrices and Anticipated RAIs","01-matrices-and-anticipated-rais.md"],
      ["Classification and the Docket","02-classification-and-the-docket.md"],
      ["Name the Gap, Name the Vehicle","03-name-the-gap-name-the-vehicle.md"],
      ["Open Issues","open-issues.md"]]},
  ]},
  { label:"Issue Register", register:{ dir:"register", intro:["How to Read the Register","README.md"], entries:[
      ["LI-01","Counter-UAS Defeat Authority","LI-01-counter-uas-defeat-authority.md"],
      ["LI-02","Campus-Scaled CDA Identification","LI-02-campus-scaled-cda-identification.md"],
      ["LI-03","Shared Digital I&C Guidance","LI-03-shared-digital-ic-guidance.md"],
      ["LI-04","State-Actor Pre-Positioning","LI-04-state-actor-pre-positioning.md"],
      ["LI-05","Reduced-EPZ Conditionality","LI-05-reduced-epz-conditionality.md"],
      ["LI-06","Aggregate Inventory in the EPZ Demonstration","LI-06-aggregate-inventory-in-the-epz-demonstration.md"],
      ["LI-07","ASSC Duration on Aggregate Demand","LI-07-assc-duration-on-aggregate-demand.md"],
      ["LI-08","GDC 5 Sharing of Structures","LI-08-gdc-5-sharing-of-structures.md"],
      ["LI-09","ML-Provenance Safety Logic","LI-09-ml-provenance-safety-logic.md"],
      ["LI-10","Deterministic Intent under Part 53","LI-10-deterministic-intent-under-part-53.md"],
      ["LI-11","The Warning Pathway and Who Decides","LI-11-the-warning-pathway-and-who-decides.md"],
      ["LI-12","Public Docket and Safeguards Split","LI-12-public-docket-and-safeguards-split.md"],
      ["LI-13","Geopolitical Siting","LI-13-geopolitical-siting.md"],
      ["LI-14","Under-Frequency Load Shedding","LI-14-under-frequency-load-shedding.md"],
      ["LI-15","Simultaneous Multi-Module Trip","LI-15-simultaneous-multi-module-trip.md"],
      ["LI-16","The Part 53 / Part 57 Band","LI-16-the-part-53-part-57-band.md"],
  ]}},
  { label:"Reference", items:[
    {t:"Instrument Library", f:"resources/instrument-library.md"},
    {t:"Glossary", f:"resources/glossary.md"},
    {t:"Regulatory Index", f:"resources/regulatory-index.md"},
    {t:"Course Notes", f:"resources/course-notes/README.md"},
    {t:"CN · M04-CN-01 Safety/Security Interface", f:"resources/course-notes/M04-CN-01-safety-security-interface.md"},
    {t:"Conventions", f:"CONVENTIONS.md"},
    {t:"Repository Structure", f:"STRUCTURE.md"},
  ]},
];

const tree = document.getElementById('navtree');
const mdEl = document.getElementById('md');

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

function buildNav(){
  NAV.forEach(group=>{
    if(group.label) tree.appendChild(el('div','grouplabel',group.label));
    if(group.items){
      const wrap=el('div','flat');
      group.items.forEach(it=>{
        const a=el('a',null,it.t); a.href='#/'+it.f; a.dataset.f=it.f;
        wrap.appendChild(a);
      });
      tree.appendChild(wrap);
    }
    if(group.modules){
      group.modules.forEach(m=>{
        const d=el('details');
        const s=el('summary'); s.appendChild(el('span','mk','&#9656;'));
        s.appendChild(document.createTextNode(m.t)); d.appendChild(s);
        const u=el('div','units');
        m.units.forEach(([label,file])=>{
          const path=m.dir+'/'+file;
          const a=el('a',null,label); a.href='#/'+path; a.dataset.f=path;
          u.appendChild(a);
        });
        d.appendChild(u); tree.appendChild(d);
      });
    }
    if(group.register){
      const r=group.register;
      const flat=el('div','flat');
      const ip=r.dir+'/'+r.intro[1];
      const ia=el('a',null,r.intro[0]); ia.href='#/'+ip; ia.dataset.f=ip;
      flat.appendChild(ia); tree.appendChild(flat);

      const d=el('details');
      const s=el('summary'); s.appendChild(el('span','mk','&#9656;'));
      s.appendChild(document.createTextNode('Open Issues ('+r.entries.length+')'));
      d.appendChild(s);
      const u=el('div','units');
      r.entries.forEach(([id,label,file])=>{
        const path=r.dir+'/'+file;
        const a=el('a','reg'); a.href='#/'+path; a.dataset.f=path;
        a.appendChild(el('span','li',id));
        a.appendChild(document.createTextNode(label));
        u.appendChild(a);
      });
      d.appendChild(u); tree.appendChild(d);
    }
  });
}

// Markdown files link to each other with ordinary relative paths (../../CONVENTIONS.md,
// register/LI-01-....md). This site serves every page from a #/ route, so those links
// must be resolved against the current file's folder and rewritten into routes, or the
// browser goes looking for a real file and gets a 404.
function resolvePath(base, href){
  const parts = base.split('/'); parts.pop();           // drop the filename
  href.split('/').forEach(seg=>{
    if(seg==='' || seg==='.') return;
    if(seg==='..') parts.pop(); else parts.push(seg);
  });
  return parts.join('/');
}

function rewriteLinks(path){
  mdEl.querySelectorAll('a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if(!href || /^([a-z]+:|\/\/|#|mailto:)/i.test(href)) return;   // external, anchor, or mail
    const [file, frag] = href.split('#');
    if(!/\.md$/i.test(file)) return;                                 // only markdown targets
    a.setAttribute('href', '#/' + resolvePath(path, file) + (frag ? '#'+frag : ''));
  });
}

async function load(path){
  mdEl.innerHTML='<p class="loaderr">Loading…</p>';
  try{
    const res=await fetch(path,{cache:'no-cache'});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    mdEl.innerHTML=marked.parse(text);
    rewriteLinks(path);
    mdEl.classList.remove('md'); void mdEl.offsetWidth; mdEl.classList.add('md');
    window.scrollTo(0,0);
    document.querySelector('.content').scrollTo?.(0,0);
  }catch(e){
    mdEl.innerHTML='<h1>Not available offline</h1><p class="loaderr">This page loads its content from the repository and needs to be viewed on the published site (or a local web server), not by opening the file directly. On GitHub Pages it will display normally.</p>';
  }
  setActive(path);
  document.querySelectorAll('details').forEach(d=>{
    if(d.querySelector('a[data-f="'+cssEsc(path)+'"]')) d.open=true;
  });
  document.getElementById('nav').classList.remove('open');
}

function cssEsc(s){return s.replace(/"/g,'\\"');}
function setActive(path){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active', a.dataset.f===path));
}

function route(){
  let h=location.hash.replace(/^#\//,'');
  if(!h) h='README.md';
  load(h);
}

document.getElementById('navToggle').addEventListener('click',()=>{
  document.getElementById('nav').classList.toggle('open');
});

buildNav();
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
